<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="小爱GO — 把闲置的小爱音箱变成自己的 AI 语音助手">
  <title>小爱GO</title>
  <desc>小爱GO：接管家里的 AI 语音助手，支持豆包 / Edge / 本地模型</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132034"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="300" fill="url(#glow)"/>

  <g transform="translate(120 208)">
    <rect width="224" height="224" rx="52" fill="#17243A" stroke="#2B3B55" stroke-width="2"/>
    <rect x="36.7" y="85.8" width="21" height="52.5" rx="10.5" fill="#94A3B8" opacity=".85"/>
    <rect x="69.1" y="68.3" width="21" height="87.5" rx="10.5" fill="#E2E8F0" opacity=".95"/>
    <rect x="101.5" y="49"   width="21" height="126"  rx="10.5" fill="url(#accent)"/>
    <rect x="133.9" y="68.3" width="21" height="87.5" rx="10.5" fill="#E2E8F0" opacity=".95"/>
    <rect x="166.2" y="85.8" width="21" height="52.5" rx="10.5" fill="#94A3B8" opacity=".85"/>
  </g>

  <text x="396" y="292" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="84" font-weight="700" fill="#F8FAFC">小爱GO</text>
  <text x="400" y="352" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#94A3B8">把闲置的小爱音箱，变成自己的 AI 语音助手</text>

  <text x="120" y="576" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#475569">github.com/aidevjoe/xiaoai-go</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#64748B">
    <text x="400" y="404">豆包 TTS · Edge TTS · 声音复刻 · 本地 sherpa-onnx</text>
    <text x="400" y="440">KWS 唤醒 · HA 控制 · 联网搜索 · 多助手多音色</text>
  </g>
</svg>
