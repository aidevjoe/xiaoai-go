<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="小爱GO" />
    <meta name="description" content="小爱GO 管理后台：设备、引擎、语音与工具设置" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>小爱GO · 管理后台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--
      主题必须在首屏渲染之前定下来，否则深色系统会先闪一下白底再变黑。
      所以这段内联在 head 里，不能放进打包后的 JS（那个是异步加载的）。
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('xiaoai-theme') || 'auto'
          var dark =
            t === 'dark' ||
            (t === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#080b11' : '#f4f6f8')
          var status = document.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]',
          )
          if (status) status.setAttribute('content', dark ? 'black-translucent' : 'default')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
